name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -short ./...
      - name: cross-compile
        run: |
          v=$(git describe --tags --always --dirty 2>/dev/null || echo dev)
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch               go build -ldflags "-s -w -X main.version=$v" -o dist/spawn-linux-$arch .
          done
          ls -l dist/

  # The shipped suites name ~100 nixpkgs attributes. Evaluation is what catches a
  # renamed attribute, an unfree licence or an insecure package, and it downloads
  # nothing -- so guard every suite on every push rather than finding out at `up`.
  # Resolve against nixpkgs directly: W0.6 used a third-party aggregator and got
  # 6 of 34 answers wrong in both directions.
  suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: go build -o spawn .
      - name: every suite evaluates with no licence opt-in
        run: |
          fail=0
          # --names, not the human table: its header and rule are not contractual.
          for p in $(./spawn profiles --names); do
            printf 'schema = 1\nname = "%s"\nprofiles = ["%s"]\n' "$p" "$p" > /tmp/$p.toml
            ./spawn check /tmp/$p.toml || fail=1
          done
          exit $fail
      - name: integration tests against a real runtime
        # Lifecycle, persist-survives-rm, the leak tests and the MCP tool paths all
        # need podman and a nix store, so they only run here. They skip rather than
        # fail if either is missing.
        run: go test -v ./...
      - name: install the binary for the scripted suites
        run: |
          go build -o /usr/local/bin/spawn .
          spawn version
      - name: agent loop over MCP
        # The M4 exit criterion: an agent provisioning, using and destroying its own
        # environment with no human in the loop.
        run: python3 test/agent-loop.py
      - name: VPN datapath, OpenVPN and WireGuard
        # The M3 deliverable: a real payload crossing a real tunnel with the kill
        # switch in force. Needs a second env as the server, which is why it is a
        # script rather than a Go test.
        run: bash test/vpn-datapath.sh

  # The M5 exit criterion: every tool in every suite RUNS, not merely resolves.
  # Separate job because it downloads each suite's closure -- the `suites` job
  # deliberately only evaluates, which is seconds, and this is minutes.
  #
  # One job per suite rather than a loop, so a failure names the suite in the UI and
  # one broken package does not hide the state of the others.
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every shipped suite, pentest included: it is the daily driver, and its own
        # four tools are covered nowhere else. A test asserts this list matches
        # `spawn profiles --names`, so adding a suite without adding it here fails.
        suite: [general, recon, creds, pivot, osint, wifi, active-directory, web, ctf, forensics, pentest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: go build -o /usr/local/bin/spawn .
      - name: ${{ matrix.suite }} — every tool runs
        run: spawn smoke ${{ matrix.suite }}

  # M5's first exit criterion, as far as CI can carry it: not "every tool runs" but
  # "the workflow an engagement is made of works". Recon through report, against a
  # three-container lab this builds itself, on one profile, with egress denied.
  engagement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: go build -o /usr/local/bin/spawn .
      - name: a full engagement, no Exegol
        run: bash test/engagement.sh

  # Can an env run the SERVICES a tool needs, not just the tool? postgres refuses to
  # run as root and an env runs as root, so this is the one that was never tested.
  services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: go build -o /usr/local/bin/spawn .
      - name: postgres and neo4j inside one env
        run: bash test/services.sh
