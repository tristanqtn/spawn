# forensics — disk, memory acquisition and artefact analysis.
#
# Memory ANALYSIS is deliberately missing: volatility3 is unfree in nixpkgs (the
# 'vol-sl' licence) and nothing free replaces it, so it would break every build of
# this suite until a manifest can opt in to unfree packages (M2). avml covers
# acquisition; add volatility3 by hand once the opt-in field exists.
description = "disk and artefact analysis: sleuthkit, autopsy, yara"

tools = [
  "sleuthkit", "autopsy", "libewf", "afflib", "dc3dd", "ddrescue",
  "avml",
  "bulk_extractor", "foremost", "scalpel", "testdisk", "ext4magic",
  "binwalk", "exiftool", "regripper", "mac-robber",
  "hashdeep", "ssdeep", "yara", "clamav",
  "wireshark-cli", "tcpdump",
]

[smoke]
"afflib" = "command -v affinfo"
"autopsy" = "command -v autopsy"
"avml" = "command -v avml"
"binwalk" = "command -v binwalk"
"bulk_extractor" = "command -v bulk_extractor"
"clamav" = "command -v clamscan"
"dc3dd" = "command -v dc3dd"
"ddrescue" = "command -v ddrescue"
"exiftool" = "exiftool -ver"
"ext4magic" = "command -v ext4magic"
"foremost" = "command -v foremost"
"hashdeep" = "command -v hashdeep"
"libewf" = "command -v ewfinfo"
"mac-robber" = "command -v mac-robber"
# nixpkgs names the binary regripper, not upstream's rip.pl.
"regripper" = "command -v regripper"
"scalpel" = "command -v scalpel"
"sleuthkit" = "command -v fls"
"ssdeep" = "command -v ssdeep"
"tcpdump" = "tcpdump --version"
"testdisk" = "command -v testdisk"
"wireshark-cli" = "tshark --version"
"yara" = "yara --version"
