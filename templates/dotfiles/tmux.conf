# tmux, Dracula.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 50000
set -sg escape-time 10
set -g renumber-windows on

# Reload without leaving.
bind r source-file ~/.tmux.conf \; display "reloaded"

# Splits that keep the current directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Dracula palette.
BG="#282a36"; CURRENT="#44475a"; FG="#f8f8f2"
COMMENT="#6272a4"; CYAN="#8be9fd"; GREEN="#50fa7b"
PURPLE="#bd93f9"; PINK="#ff79c6"

set -g status-position bottom
set -g status-style "bg=$BG,fg=$FG"
set -g status-left  "#[bg=$PURPLE,fg=$BG,bold] #{?#{==:#{SPAWN_ENV},},#S,#{SPAWN_ENV}} #[default] "
set -g status-right "#[fg=$COMMENT]%b %d, %Y #[fg=$CYAN]%H:%M:%S "
set -g status-right-length 40
setw -g window-status-current-style "fg=$GREEN,bold"
setw -g window-status-style "fg=$COMMENT"
set -g pane-border-style "fg=$CURRENT"
set -g pane-active-border-style "fg=$PURPLE"
set -g message-style "bg=$CURRENT,fg=$FG"
